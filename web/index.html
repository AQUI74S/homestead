<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Homestead</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F6F78'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='3.5' stroke-dasharray='36 50' transform='rotate(-90 16 16)'/%3E%3C/svg%3E">
</head>
<body>
<div class="wrap">
  <header class="top" id="top" hidden>
    <div class="brand"><h1 id="areaTitle">Haushaltsbuch</h1><span id="syncState" class="status"></span></div>
    <div class="areas" role="group" aria-label="Bereich">
      <a href="#monat" data-area="haushalt">Haushaltsbuch</a>
      <a href="#hv" data-area="verwaltung">Hausverwaltung</a>
    </div>
    <div class="monthnav" id="monthnav" role="group" aria-label="Monat wählen">
      <button id="prevM" aria-label="Vorheriger Monat">‹</button>
      <span class="mwrap"><strong id="mLabel"></strong><span id="pRange" class="prange"></span></span>
      <button id="nextM" aria-label="Nächster Monat">›</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Seiten"></nav>
  </header>
  <main id="main"><div class="card empty">Lädt …</div></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
<script src="hv.js"></script>
</body>
</html>
